# Render Blueprint: FastAPI backend and static React frontend.
# PostgreSQL is hosted on Neon (Render's free Postgres expires after 30 days).
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: review-harness-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start. Safe here: one instance, and Alembic upgrades are idempotent.
    startCommand: >-
      alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    # Liveness only, so a suspended Neon database cannot cause restart loops.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: APP_ENV
        value: production
      - key: PLANNER
        value: mock
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: review-harness-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
