[tool.pytest.ini_options]
# Make `backend` importable regardless of how pytest is invoked.
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is used for invariants and in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]

[tool.mypy]
python_version = "3.11"
packages = ["backend"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["backend/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["backend.migrations.*"]
disallow_untyped_defs = false
