name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: review_harness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only credentials for a throwaway service container.
      TEST_DATABASE_URL: postgresql+psycopg://harness:harness@localhost:5432/review_harness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check .
      - run: mypy
      - run: pytest -q
