name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # CI-only credentials for throwaway service containers.
  PG_URL: postgresql+psycopg://harness:harness@localhost:5432

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: harness, POSTGRES_PASSWORD: harness, POSTGRES_DB: review_harness_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U harness" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check .
      - run: mypy
      - run: pytest -q
        env: { TEST_DATABASE_URL: "${{ env.PG_URL }}/review_harness_test" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: harness, POSTGRES_PASSWORD: harness, POSTGRES_DB: review_harness_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U harness" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PYTHON: python
      E2E_DATABASE_URL: postgresql+psycopg://harness:harness@localhost:5432/review_harness_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with: { node-version: "26", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }
